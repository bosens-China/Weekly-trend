name: Weekly Trend Report

on:
  schedule:
    # GitHub Trending 的「本周」是滚动 7 天窗口、约每天重算一次，没有固定的每周清零时刻，
    # 所以一周里任意固定时间跑都行。这里取北京时间周一 07:48 = UTC 周日 23:48（故星期字段是 0=周日）。
    # 再加一个北京时间周一 08:18 = UTC 周一 00:18 作为补偿，降低 GitHub schedule 偶发丢调度的影响。
    # 注意：错开整点 / 0 点这类全球最拥堵时段，可显著降低 GitHub schedule 的派发延迟。
    - cron: "48 23 * * 0"
    - cron: "18 0 * * 1"
  push:
    # push 也触发，但 src/main.py 里有守卫：本 ISO 周已生成过就跳过，只在本周缺报告时补生成。
    # 机器人用 GITHUB_TOKEN 提交回仓库的 push 不会再触发新 run（GitHub 防递归机制），无需担心死循环。
    branches: [master]
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write # 需要把生成的周刊 commit 回仓库

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Generate weekly report
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 非敏感配置读取 Repository Variables，API Key 继续使用 Secrets。
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          # 用于调 GitHub API 抓 README，提高速率限制
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python src/main.py

      - name: Commit report and cache
        if: ${{ !cancelled() && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure') }}
        env:
          REPORT_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 生成失败时只保存已成功批次的缓存，避免重跑时重复消耗 LLM。
          message="chore: 保存已完成的 LLM 缓存"
          if [ "$REPORT_OUTCOME" = "success" ]; then
            git add reports/ README.md feed.xml
            message="docs: 自动生成 GitHub 一周热点"
          fi
          # 首次成功写入 LLM 缓存后 cache/ 才会存在。
          if [ -d cache ]; then
            git add cache/
          fi
          if git diff --staged --quiet; then
            echo "报告与缓存均无变化，跳过提交。"
          else
            git commit -m "$message"
            git push
          fi
